name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test && pnpm run build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t linguasearch:ci .
      - name: Smoke test production container
        run: |
          docker run -d --name lingua -p 8000:8000 -e WORKSPACE_TOKEN=ci-only-token-with-at-least-32-characters linguasearch:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/documents)" = "401"
          curl --fail -H 'Authorization: Bearer ci-only-token-with-at-least-32-characters' http://localhost:8000/api/documents
